name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          TAXSHIELD_KEY: "0011223344556677889900112233445566778899001122334455667788990011"
          JWT_SECRET: "ci-only-jwt-secret-not-for-production-use-0123456789"
          LLM_PROVIDER: none
        run: pytest tests/ -q
      - name: Dependency audit (informational)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict=false || true
